openapi: 3.0.3
info:
  title: Boleto CNAB API
  description: |
    API REST para geração de boletos bancários brasileiros, arquivos CNAB e parsing de extratos OFX.

    Esta API expõe as funcionalidades da gem [brcobranca](https://github.com/Maxwbh/brcobranca)
    como um microsserviço HTTP, permitindo integração com qualquer linguagem de programação.

    ## Funcionalidades

    - **Boletos**: Geração de boletos em PDF, JPG, PNG ou TIF (18+ bancos)
    - **Remessa**: Geração de arquivos CNAB 240 e 400
    - **Retorno**: Parsing de arquivos de retorno CNAB 240 e 400
    - **OFX**: Parsing de extratos bancários OFX v1 (SGML) e v2 (XML) com extração automática de nosso_numero

    ## Bancos Suportados

    | Banco | Código | Boleto | CNAB 240 | CNAB 400 | PIX |
    |-------|--------|--------|----------|----------|-----|
    | Banco do Brasil | 001 | ✅ | ✅ | ✅ | ✅ |
    | Itaú | 341 | ✅ | ❌ | ✅ | ✅ |
    | Bradesco | 237 | ✅ | ❌ | ✅ | ✅ |
    | Caixa | 104 | ✅ | ✅ | ❌ | ✅ |
    | Santander | 033 | ✅ | ✅ | ✅ | ✅ |
    | Sicoob | 756 | ✅ | ✅ (remessa) | ❌ (remessa) | ✅ |
    | Sicredi | 748 | ✅ | ✅ | ❌ | ✅ |
    | Banrisul | 041 | ✅ | ❌ | ✅ | — |
    | Banco C6 | 336 | ✅ | ❌ | ✅ | ✅ |
    | Unicred | 136 | ✅ | ✅ | ✅ | — |
    | Ailos | 085 | ✅ | ✅ | ❌ | — |

  version: 1.5.0
  contact:
    name: Maxwell da Silva Oliveira
    email: maxwbh@gmail.com
    url: https://www.msbrasil.inf.br
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://boleto-cnab-api.onrender.com
    description: Production (Render.com)
  - url: http://localhost:9292
    description: Local development

tags:
  - name: Health
    description: Verificação de saúde da API
  - name: Boleto
    description: Operações com boletos bancários
  - name: Remessa
    description: Geração de arquivos de remessa CNAB
  - name: Retorno
    description: Parsing de arquivos de retorno CNAB
  - name: OFX
    description: Parsing de extratos bancários OFX
  - name: Render
    description: |
      Renderização (engine BrCobrança) — dados + PDF + CNAB com corpo JSON e
      resposta normalizada. Consumido pelo gateway Boleto-API (Python).

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Verificar status da API
      description: Endpoint para health check da API
      operationId: healthCheck
      responses:
        '200':
          description: API funcionando normalmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: OK
                timestamp: '2026-05-28T01:42:48Z'

  /api/info:
    get:
      tags:
        - Health
      summary: Informações da API
      description: Retorna nome, versão, bancos suportados e formatos
      operationId: getInfo
      responses:
        '200':
          description: Informações da API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'

  /api/metadata:
    get:
      tags:
        - Health
      summary: Metadados da API e da gem brcobranca
      description: |
        Retorna detalhes da API (versão, Ruby, ambiente), da gem brcobranca
        (versão, repositório) e lista completa de endpoints disponíveis.
      operationId: getMetadata
      responses:
        '200':
          description: Metadados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'

  /api/bancos:
    get:
      tags:
        - Health
      summary: Lista bancos suportados com capacidades detalhadas
      description: |
        Retorna os 18 bancos suportados com capacidades por tipo:
        boleto (formatos, PIX, carteiras), remessa (CNAB 240/400, com ou sem PIX),
        retorno (CNAB 240/400) e extras específicos por banco.

        Dados vêm dinamicamente do módulo `Brcobranca::Bancos` (v12.7.0+).
      operationId: listBancos
      responses:
        '200':
          description: Lista de bancos com capacidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BancoInfo'

  /api/boleto/validate:
    get:
      tags:
        - Boleto
      summary: Validar dados do boleto
      description: Valida os dados do boleto sem gerar o arquivo
      operationId: validateBoleto
      parameters:
        - name: bank
          in: query
          required: true
          description: Código do banco
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: data
          in: query
          required: true
          description: Dados do boleto em JSON
          schema:
            type: string
            format: json
      responses:
        '200':
          description: Dados válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationSuccess'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/boleto/data:
    get:
      tags:
        - Boleto
      summary: Obter dados calculados do boleto
      description: |
        Retorna todos os dados calculados do boleto sem gerar o arquivo,
        incluindo código de barras, linha digitável e nosso número formatado.
      operationId: getBoletoData
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: data
          in: query
          required: true
          description: Dados do boleto em JSON
          schema:
            type: string
            format: json
      responses:
        '200':
          description: Dados do boleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoResponse'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/boleto/nosso_numero:
    get:
      tags:
        - Boleto
      summary: Gerar nosso número
      description: Gera apenas o nosso número e campos relacionados
      operationId: getNossoNumero
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: data
          in: query
          required: true
          schema:
            type: string
            format: json
      responses:
        '200':
          description: Nosso número gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NossoNumeroResponse'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/boleto:
    get:
      tags:
        - Boleto
      summary: Gerar boleto
      description: Gera boleto em PDF ou imagem
      operationId: generateBoleto
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: type
          in: query
          required: true
          description: Formato de saída
          schema:
            $ref: '#/components/schemas/OutputType'
        - name: data
          in: query
          required: true
          description: Dados do boleto em JSON
          schema:
            type: string
            format: json
        - name: include_data
          in: query
          required: false
          description: |
            Se `true`, retorna JSON com todos os dados do boleto + arquivo
            em base64 (uma única chamada para PDF + metadados).
            Se omitido (padrão), retorna o binário puro + headers X-*.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
        - name: template
          in: query
          required: false
          description: |
            Template de geração do PDF:
            - `rghost` (padrão): usa GhostScript, suporta todos os formatos.
            - `prawn`: Ruby puro, sem GhostScript — **apenas PDF**.
            - `carne`: carnê (1 via por página) via Prawn — **apenas PDF**.

            Os templates Prawn (`prawn`/`carne`) aplicam o tema visual opcional
            passado em `data` (ver campos de tema no schema `BoletoData`:
            `logo_empresa`, `cor_marca`, `marca_dagua`, `rodape_contato`,
            `fonte_ttf`, `parcela_atual`, `total_parcelas`).
          schema:
            type: string
            enum: [rghost, prawn, carne]
            default: rghost
      responses:
        '200':
          description: |
            Sem include_data: arquivo binário + headers `X-Nosso-Numero*`.
            Com include_data=true: JSON contendo dados + `content_base64`.
          headers:
            X-Nosso-Numero:
              schema:
                type: string
              description: Nosso número padronizado (valor cru, sem DV).
              example: '000000123'
            X-Nosso-Numero-Formatado:
              schema:
                type: string
              description: Nosso número formatado (impresso no boleto, com DV).
              example: '01234567000000123'
            X-Nosso-Numero-DV:
              schema:
                type: string
              description: Dígito verificador do nosso número.
              example: '9'
            X-Codigo-Barras:
              schema:
                type: string
              description: Código de barras (44 dígitos).
              example: '00196131200001500000000000123456700000012318'
            X-Linha-Digitavel:
              schema:
                type: string
              description: Linha digitável formatada.
              example: '00190.00009 00123.456709 00000.123182 6 13120000150000'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/BoletoWithFileResponse'
              examples:
                with_include_data:
                  summary: Response com include_data=true
                  value:
                    bank: banco_brasil
                    nosso_numero: '000000123'
                    nosso_numero_formatado: '01234567000000123'
                    nosso_numero_dv: '9'
                    codigo_barras: '00196131200001500000000000123456700000012318'
                    linha_digitavel: '00190.00009 00123.456709 00000.123182 6 13120000150000'
                    content_base64: 'JVBERi0xLjQK...'
                    content_type: application/pdf
                    filename: boleto-banco_brasil.pdf
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/boleto/multi:
    post:
      tags:
        - Boleto
      summary: Gerar múltiplos boletos
      description: Gera múltiplos boletos em um único arquivo
      operationId: generateMultipleBoletos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - type
                - data
              properties:
                type:
                  $ref: '#/components/schemas/OutputType'
                data:
                  type: string
                  format: binary
                  description: Arquivo JSON com array de boletos (cada um com campo "bank")
                include_data:
                  type: string
                  enum: ['true', 'false']
                  default: 'false'
                  description: |
                    Se `true`, retorna JSON com array de metadados de cada
                    boleto + arquivo combinado em base64. Caso contrário,
                    retorna o binário + headers `X-Boletos-Info`.
      responses:
        '200':
          description: |
            Sem include_data: arquivo binário + headers `X-Boletos-Info` e `X-Boletos-Count`.
            Com include_data=true: JSON contendo array `boletos` + `content_base64`.
          headers:
            X-Boletos-Count:
              schema:
                type: integer
              description: Número total de boletos gerados.
              example: 3
            X-Boletos-Info:
              schema:
                type: string
                format: json
              description: |
                Array JSON com metadados de cada boleto (bank, nosso_numero,
                nosso_numero_formatado, nosso_numero_dv, codigo_barras, linha_digitavel).
              example: '[{"bank":"banco_brasil","nosso_numero":"000000123","nosso_numero_formatado":"01234567000000123","nosso_numero_dv":"9","codigo_barras":"...","linha_digitavel":"..."}]'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/MultiBoletoResponse'
              examples:
                with_include_data:
                  summary: Response com include_data=true
                  value:
                    total: 2
                    boletos:
                      - bank: banco_brasil
                        nosso_numero: '000000123'
                        nosso_numero_formatado: '01234567000000123'
                        nosso_numero_dv: '9'
                        codigo_barras: '00196131200001500000000000123456700000012318'
                        linha_digitavel: '00190.00009 00123...'
                      - bank: sicoob
                        nosso_numero: '0007890'
                        nosso_numero_formatado: '00078900'
                        nosso_numero_dv: '0'
                        codigo_barras: '75693131200002500001432701022938500078900001'
                        linha_digitavel: '75691.43271 01022.938503 00789.000016 3 13120000250000'
                    content_base64: 'JVBERi0xLjQK...'
                    content_type: application/pdf
                    filename: boletos-multi.pdf
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/remessa:
    post:
      tags:
        - Remessa
      summary: Gerar arquivo de remessa
      description: |
        Gera arquivo de remessa CNAB 240 ou 400.
        Com `pix=true`, gera remessa com segmento PIX (boleto híbrido).
      operationId: generateRemessa
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CnabType'
        - name: pix
          in: query
          required: false
          description: |
            Se `true`, usa classe PIX do banco para adicionar segmento PIX
            na remessa CNAB. CNAB 400 PIX: Bradesco, Itaú, C6, Santander.
            CNAB 240 PIX: Sicoob, Caixa, Banco do Brasil.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: string
                  format: binary
                  description: Arquivo JSON com dados da remessa e pagamentos
            examples:
              c6_cnab400:
                summary: Banco C6 — CNAB 400
                description: >
                  Use `codigo_beneficiario` (obrigatório). NÃO enviar `convenio`.
                  Campos do pagamento: `nome_sacado`, `documento_sacado`, endereço separado.
                value:
                  data: |
                    {
                      "empresa_mae": "Empresa C6 LTDA",
                      "documento_cedente": "33445566000177",
                      "agencia": "0001",
                      "conta_corrente": "1234567",
                      "digito_conta": "0",
                      "carteira": "10",
                      "codigo_beneficiario": "0012345678",
                      "pagamentos": [{
                        "nosso_numero": "12345678",
                        "data_vencimento": "2026/12/31",
                        "valor": 1500.00,
                        "nome_sacado": "Joao da Silva",
                        "documento_sacado": "12345678900",
                        "endereco_sacado": "Rua Teste, 100",
                        "bairro_sacado": "Centro",
                        "cep_sacado": "01000000",
                        "cidade_sacado": "Sao Paulo",
                        "uf_sacado": "SP"
                      }]
                    }
              sicoob_cnab240:
                summary: Sicoob — CNAB 240
                description: >
                  NÃO enviar `variacao` (campo do boleto, não existe na remessa CNAB240 Sicoob).
                value:
                  data: |
                    {
                      "empresa_mae": "Cooperativa Teste",
                      "documento_cedente": "98765432000100",
                      "agencia": "4327",
                      "conta_corrente": "417270",
                      "convenio": "229385",
                      "carteira": "1",
                      "pagamentos": [{
                        "nosso_numero": "7890",
                        "data_vencimento": "2026/12/31",
                        "valor": 2500.00,
                        "nome_sacado": "Maria Santos",
                        "documento_sacado": "98765432100",
                        "endereco_sacado": "Av. Principal, 50",
                        "bairro_sacado": "Centro",
                        "cep_sacado": "20000000",
                        "cidade_sacado": "Rio de Janeiro",
                        "uf_sacado": "RJ"
                      }]
                    }
      responses:
        '200':
          description: Arquivo de remessa gerado
          content:
            text/plain:
              schema:
                type: string
                description: Conteúdo do arquivo CNAB
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/retorno:
    post:
      tags:
        - Retorno
      summary: Processar arquivo de retorno
      description: Faz parsing de arquivo de retorno CNAB 240 ou 400
      operationId: processRetorno
      parameters:
        - name: bank
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BankCode'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CnabType'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: string
                  format: binary
                  description: Arquivo de retorno CNAB
      responses:
        '200':
          description: Retorno processado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoResponse'
        '400':
          description: Erro de processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ofx/parse:
    post:
      tags:
        - OFX
      summary: Parsear arquivo OFX (extrato bancário)
      description: |
        Parseia arquivo OFX e retorna JSON estruturado com:
        - Dados do banco (ORG, FID)
        - Dados da conta (agência, número, tipo)
        - Período do extrato
        - Saldo
        - Lista de transações classificadas (crédito/débito)
        - Extração automática de `nosso_numero` do campo memo por banco
        - Resumo com totais de créditos e débitos

        **Recursos:**
        - Suporta OFX v1 (SGML) e v2 (XML)
        - Conversão automática de encoding Latin-1 → UTF-8
        - Extração por regex para Sicoob, Itaú, Banco do Brasil, Bradesco e Caixa
        - Fallback genérico para outros bancos

        **Filtros opcionais:**
        - `somente_creditos=true`: retorna apenas transações de crédito
      operationId: parseOfx
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo OFX (extrato bancário)
                somente_creditos:
                  type: string
                  enum: ['true', 'false']
                  default: 'false'
                  description: Se 'true', retorna apenas transações de crédito
      responses:
        '201':
          description: Arquivo OFX parseado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfxResponse'
        '400':
          description: Arquivo OFX inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfxError'

  /api/render/boleto:
    post:
      tags:
        - Render
      summary: Renderizar boleto (dados + PDF base64)
      description: |
        Registra/calcula os dados do boleto (linha digitável, código de barras,
        nosso número) e devolve o PDF em base64. Corpo JSON. Template padrão
        `prawn` (sem GhostScript). Consumido pelo gateway via `brcobranca_proxy`.
      operationId: renderBoleto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank, data]
              properties:
                bank:
                  type: string
                  example: itau
                data:
                  type: object
                  description: Dados do boleto (mesmos campos de /api/boleto)
                template:
                  type: string
                  enum: [prawn, carne, rghost]
                  default: prawn
      responses:
        '201':
          description: Boleto renderizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  nosso_numero: { type: string, example: '00000001' }
                  linha_digitavel: { type: string }
                  codigo_barras: { type: string }
                  pdf_base64: { type: string, description: PDF em base64 }
        '400':
          description: Dados do boleto inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/render/carne:
    post:
      tags:
        - Render
      summary: Renderizar carnê (N boletos) em PDF
      description: |
        Gera o carnê a partir de uma lista de boletos. Template padrão `carne`
        (3 vias por A4, sem GhostScript); `prawn` gera 1 boleto por página.
      operationId: renderCarne
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boletos]
              properties:
                bank:
                  type: string
                  description: Banco comum a todos (se cada boleto não trouxer o seu)
                  example: itau
                boletos:
                  type: array
                  items: { type: object }
                  description: Lista de boletos (cada um com seus dados)
                template:
                  type: string
                  enum: [carne, prawn]
                  default: carne
      responses:
        '201':
          description: Carnê renderizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_base64: { type: string, description: PDF do carnê em base64 }
        '400':
          description: Falha ao gerar carnê
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/render/remessa:
    post:
      tags:
        - Render
      summary: Renderizar arquivo de remessa CNAB (texto)
      description: Gera o conteúdo da remessa CNAB 240/400 com corpo JSON.
      operationId: renderRemessa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank, type, data]
              properties:
                bank:
                  type: string
                  example: itau
                type:
                  type: string
                  enum: [cnab400, cnab240]
                data:
                  type: object
                  description: Dados da remessa e pagamentos
                pix:
                  type: boolean
                  default: false
                  description: Segmento PIX (boleto híbrido)
      responses:
        '201':
          description: Remessa gerada
          content:
            application/json:
              schema:
                type: object
                properties:
                  cnab: { type: string, description: Conteúdo do arquivo CNAB }
        '400':
          description: Erro ao gerar remessa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    BankCode:
      type: string
      enum:
        - banco_brasil
        - itau
        - bradesco
        - caixa
        - santander
        - sicoob
        - sicredi
        - banrisul
        - banestes
        - banco_nordeste
        - banco_brasilia
        - banco_c6
        - unicred
        - credisis
        - safra
        - citibank
        - hsbc
        - ailos
      description: Código do banco suportado (18 bancos brasileiros)

    OutputType:
      type: string
      enum:
        - pdf
        - jpg
        - png
        - tif
      description: Formato de saída do boleto

    CnabType:
      type: string
      enum:
        - cnab240
        - cnab400
      description: Tipo de arquivo CNAB

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: OK
        timestamp:
          type: string
          format: date-time
          example: '2026-05-28T01:42:48Z'

    InfoResponse:
      type: object
      properties:
        name:
          type: string
          example: Boleto CNAB API
        version:
          type: string
          example: '1.5.0'
        supported_banks:
          type: array
          items:
            $ref: '#/components/schemas/BankCode'
        supported_formats:
          type: array
          items:
            $ref: '#/components/schemas/OutputType'
        cnab_types:
          type: array
          items:
            $ref: '#/components/schemas/CnabType'

    MetadataResponse:
      type: object
      properties:
        api:
          type: object
          properties:
            name:
              type: string
              example: Boleto CNAB API
            version:
              type: string
              example: '1.5.0'
            ruby_version:
              type: string
              example: '3.3.6'
            rack_env:
              type: string
              example: production
        brcobranca:
          type: object
          properties:
            version:
              type: string
              example: '12.10.3'
            repository:
              type: string
              example: https://github.com/Maxwbh/brcobranca
        endpoints:
          type: object
          additionalProperties:
            type: string

    BancoInfo:
      type: object
      description: |
        Capacidades de um banco. Dados extraídos do módulo `Brcobranca::Bancos`
        (gem v12.7.0+).
      properties:
        banco:
          type: string
          description: Identificador snake_case usado nos endpoints
          example: banco_brasil
        codigo:
          type: string
          description: Código bancário oficial
          example: '001'
        nome:
          type: string
          description: Nome oficial do banco
          example: Banco do Brasil
        boleto:
          type: object
          properties:
            suportado:
              type: boolean
              example: true
            formatos:
              type: array
              items:
                type: string
              example: ['pdf', 'jpg', 'png', 'tif']
            pix:
              type: boolean
              description: Indica se o banco suporta boleto híbrido com QR Code PIX
              example: true
            carteiras:
              type: array
              items:
                type: string
              description: Carteiras aceitas pelo banco
              example: ['11', '12', '17', '18', '31']
        remessa:
          type: object
          properties:
            suportado:
              type: boolean
            formatos:
              type: array
              items:
                type: string
              description: Formatos CNAB suportados (cnab400, cnab240, cnab400_pix, cnab240_pix)
              example: ['cnab400', 'cnab240', 'cnab240_pix']
        retorno:
          type: object
          properties:
            suportado:
              type: boolean
            formatos:
              type: array
              items:
                type: string
              example: ['cnab400']
        extras:
          type: object
          additionalProperties: true
          description: 'Informações específicas adicionais (ex: Sicoob carteira 9, layout 810)'
          example:
            carteira_9: 'Usa numero_contrato no codigo de barras'
            layout_810: 'Versao alternativa CNAB 240 (cliente calcula DV)'

    BoletoWithFileResponse:
      type: object
      description: |
        Response retornada quando GET /api/boleto é chamado com `include_data=true`.
        Inclui todos os dados do boleto + arquivo em base64.
      allOf:
        - $ref: '#/components/schemas/BoletoResponse'
        - type: object
          properties:
            content_base64:
              type: string
              format: base64
              description: Conteúdo do arquivo (PDF/JPG/PNG/TIF) em base64
            content_type:
              type: string
              example: application/pdf
            filename:
              type: string
              example: boleto-banco_brasil.pdf

    MultiBoletoResponse:
      type: object
      description: |
        Response retornada quando POST /api/boleto/multi é chamado com `include_data=true`.
      properties:
        total:
          type: integer
          description: Número total de boletos gerados
          example: 2
        boletos:
          type: array
          items:
            $ref: '#/components/schemas/BoletoMetadata'
        content_base64:
          type: string
          format: base64
          description: Arquivo combinado (multi-página) em base64
        content_type:
          type: string
          example: application/pdf
        filename:
          type: string
          example: boletos-multi.pdf

    BoletoMetadata:
      type: object
      description: Metadados de um boleto no array `boletos` ou no header `X-Boletos-Info`
      properties:
        bank:
          $ref: '#/components/schemas/BankCode'
        nosso_numero:
          type: string
          example: '000000123'
        nosso_numero_formatado:
          type: string
          example: '01234567000000123'
        nosso_numero_dv:
          type: string
          example: '9'
        codigo_barras:
          type: string
        linha_digitavel:
          type: string

    BoletoData:
      type: object
      required:
        - agencia
        - conta_corrente
        - nosso_numero
        - valor
        - cedente
        - documento_cedente
        - sacado
        - sacado_documento
      properties:
        agencia:
          type: string
          description: Número da agência (sem dígito)
          example: '3073'
        conta_corrente:
          type: string
          description: Número da conta corrente
          example: '12345678'
        nosso_numero:
          type: string
          description: Nosso número do boleto
          example: '123456789'
        valor:
          type: number
          format: float
          description: Valor do boleto em reais
          example: 1500.00
        cedente:
          type: string
          description: Nome do cedente (beneficiário)
          example: Empresa LTDA
        documento_cedente:
          type: string
          description: CNPJ/CPF do cedente
          example: '12345678000100'
        sacado:
          type: string
          description: Nome do sacado (pagador)
          example: João da Silva
        sacado_documento:
          type: string
          description: CNPJ/CPF do sacado
          example: '12345678900'
        convenio:
          type: string
          description: Número do convênio (quando aplicável)
          example: '01234567'
        carteira:
          type: string
          description: Código da carteira
          example: '18'
        data_vencimento:
          type: string
          description: Data de vencimento (YYYY/MM/DD)
          example: '2025/12/31'
        numero_documento:
          type: string
          description: Número do documento
          example: 'NF-2025-001'
        sacado_endereco:
          type: string
          description: Endereço completo do sacado
          example: 'Rua Teste, 100, Centro, São Paulo, SP'
        instrucao1:
          type: string
          description: Primeira linha de instrução
          example: Não receber após o vencimento
        instrucao2:
          type: string
          description: Segunda linha de instrução
        instrucao3:
          type: string
        instrucao4:
          type: string
        instrucao5:
          type: string
        instrucao6:
          type: string
        emv:
          type: string
          description: |
            Payload EMV do PIX (para boleto híbrido). Quando enviado, o boleto
            gera QR Code PIX embutido. Suportado por: Banco do Brasil, Bradesco,
            Itaú, Sicoob, Caixa, Banco C6, Santander, Sicredi.
          example: '00020126580014br.gov.bcb.pix...'
        pix_label:
          type: string
          description: Texto exibido ao lado do QR Code no boleto híbrido
          example: 'Escaneie para pagar via PIX'
        chave_pix:
          type: string
          description: 'Chave PIX (CPF, CNPJ, email, telefone ou aleatoria). Novo em brcobranca v12.8.0.'
          example: '12345678900'
        tipo_chave_pix:
          type: string
          description: 'Tipo da chave PIX.'
          enum: ['cpf', 'cnpj', 'email', 'telefone', 'aleatoria']
          example: 'cpf'
        txid:
          type: string
          description: 'Codigo de identificacao da transacao PIX.'
          example: 'TX20260528001'
        logo_empresa:
          type: string
          description: |
            Tema visual (templates Prawn) — logo da empresa cedente.
            Path de arquivo (PNG/JPG) acessível ao servidor. Novo em brcobranca v12.10.0.
          example: '/assets/logo.png'
        cor_marca:
          type: string
          description: |
            Tema visual — cor da marca em hexadecimal RRGGBB (sem `#`). O contraste
            do texto é calculado automaticamente. Novo em brcobranca v12.10.0.
          example: '006B3F'
        marca_dagua:
          type: string
          description: |
            Tema visual — texto da marca d'água diagonal antifraude (até 60 chars),
            posicionada fora das zonas do código de barras/QR. Novo em brcobranca v12.10.0.
          example: 'CÓPIA - SEM VALOR FISCAL'
        rodape_contato:
          type: string
          description: |
            Tema visual — rodapé com contato da empresa (até 120 chars). Novo em brcobranca v12.10.0.
          example: 'Empresa Lagoa Real • (71) 3333-0000'
        fonte_ttf:
          type: string
          description: |
            Tema visual — path de fonte TTF para suporte UTF-8 completo no Prawn
            (detecção automática de variantes bold/italic). Novo em brcobranca v12.10.0.
          example: '/assets/fonts/Roboto.ttf'
        parcela_atual:
          type: integer
          description: |
            Tema visual — número da parcela atual (selo "PARCELA n/N"). Útil no
            template `carne`. Novo em brcobranca v12.10.0.
          example: 1
        total_parcelas:
          type: integer
          description: |
            Tema visual — total de parcelas (selo "PARCELA n/N"). Novo em brcobranca v12.10.0.
          example: 12

    BoletoResponse:
      type: object
      properties:
        bank:
          type: string
          example: banco_brasil
        nosso_numero:
          type: string
          description: |
            Nosso número padronizado com zeros (SEM carteira/convênio/DV).
            É o valor de entrada formatado pela gem, sem composição de impressão.
          example: '000000123'
        nosso_numero_formatado:
          type: string
          description: |
            Nosso número IMPRESSO no boleto (com carteira, convênio e/ou DV,
            conforme regra do banco). Usar este campo para exibição e conciliação.
          example: '01234567000000123'
        nosso_numero_dv:
          type: string
          description: Dígito verificador do nosso número (isolado)
          example: '9'
        codigo_barras:
          type: string
          description: Código de barras (44 dígitos)
          example: '00191234567890123456789012345678901234567890'
        linha_digitavel:
          type: string
          description: Linha digitável formatada
          example: '00191.23456 78901.234567 89012.345678 9 01234567890123'
        agencia_conta_boleto:
          type: string
          description: Agência/conta formatados para impressão
          example: '3073 / 12345678-0'
        numero_documento:
          type: string
        valor_documento:
          type: number
          format: float
        data_vencimento:
          type: string
        cedente:
          type: string
        sacado:
          type: string
        pix:
          type: object
          nullable: true
          description: |
            Dados do PIX híbrido (quando o campo `emv` foi fornecido na entrada).
            Presente apenas em bancos com suporte a PIX.
          properties:
            emv:
              type: string
              description: Payload EMV do PIX (mesmo enviado na entrada)
            qrcode_base64:
              type: string
              description: QR Code em base64 PNG (quando disponível)

    NossoNumeroResponse:
      type: object
      properties:
        nosso_numero:
          type: string
        nosso_numero_dv:
          type: string
        codigo_barras:
          type: string
        linha_digitavel:
          type: string
        agencia_conta_boleto:
          type: string

    ValidationSuccess:
      type: object
      properties:
        valid:
          type: boolean
          example: true
        message:
          type: string
          example: Dados válidos

    ValidationError:
      type: object
      properties:
        valid:
          type: boolean
          example: false
        validation_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            nosso_numero:
              - não pode ficar em branco

    RemessaRequest:
      type: object
      description: |
        Payload JSON para geração de remessa CNAB.

        > **Atenção:** Os campos vão variar conforme o banco.
        > Ver tabela completa em [docs/fields/all-banks.md](../docs/fields/all-banks.md).
      required:
        - empresa_mae
        - documento_cedente
        - agencia
        - conta_corrente
        - pagamentos
      properties:
        empresa_mae:
          type: string
          description: Nome da empresa cedente
          example: Empresa LTDA
        documento_cedente:
          type: string
          example: '12345678000100'
        agencia:
          type: string
          example: '3073'
        conta_corrente:
          type: string
          example: '12345678'
        digito_conta:
          type: string
          example: '0'
        convenio:
          type: string
          description: |
            Número do convênio (BB, Sicoob, Caixa). NÃO enviar para Banco C6
            (usar `codigo_beneficiario` em vez disso).
          example: '01234567'
        carteira:
          type: string
          example: '18'
        variacao_carteira:
          type: string
          description: |
            Variação da carteira (Banco do Brasil). NÃO confundir com
            o campo `variacao` do **boleto** do Sicoob — este campo
            não existe na classe de remessa CNAB 240 do Sicoob.
          example: '017'
        codigo_beneficiario:
          type: string
          description: |
            Código do cedente/beneficiário. **OBRIGATÓRIO para Banco C6** (CNAB 400).
            Até 10 dígitos, fornecido pelo banco ao cedente.
          example: '0012345678'
        sequencial_remessa:
          type: integer
          example: 1
        pagamentos:
          type: array
          items:
            $ref: '#/components/schemas/Pagamento'

    Pagamento:
      type: object
      description: |
        Dados de um pagamento na remessa CNAB.

        > **Atenção:** Os campos do sacado na remessa são diferentes dos do boleto:
        > - Remessa usa `nome_sacado` (não `sacado`)
        > - Remessa usa `documento_sacado` (não `sacado_documento`)
        > - Endereço é dividido em campos separados (endereco, bairro, cep, cidade, uf)
      required:
        - nosso_numero
        - data_vencimento
        - valor
      properties:
        nosso_numero:
          type: string
          example: '123456789'
        numero_documento:
          type: string
          example: 'NF-2025-001'
        data_vencimento:
          type: string
          example: '2026/12/31'
        valor:
          type: number
          format: float
          example: 1500.00
        nome_sacado:
          type: string
          description: Nome do sacado/pagador (campo correto para remessa)
          example: João da Silva
        documento_sacado:
          type: string
          description: CPF/CNPJ do sacado (campo correto para remessa)
          example: '12345678900'
        endereco_sacado:
          type: string
          description: Logradouro do sacado
          example: 'Rua Teste, 100'
        bairro_sacado:
          type: string
          example: 'Centro'
        cidade_sacado:
          type: string
          example: 'Sao Paulo'
        uf_sacado:
          type: string
          example: 'SP'
        cep_sacado:
          type: string
          example: '01000000'

    RetornoResponse:
      type: array
      items:
        $ref: '#/components/schemas/RetornoItem'

    RetornoItem:
      type: object
      properties:
        nosso_numero:
          type: string
          description: Nosso número do título
        numero_documento:
          type: string
        data_credito:
          type: string
          description: Data do crédito (YYYY-MM-DD)
        data_ocorrencia:
          type: string
          description: Data da ocorrência
        valor_titulo:
          type: number
          format: float
        valor_pago:
          type: number
          format: float
        valor_tarifa:
          type: number
          format: float
        codigo_ocorrencia:
          type: string
          description: Código da ocorrência bancária
        motivo_ocorrencia:
          type: string
          description: Descrição da ocorrência

    OfxResponse:
      type: object
      properties:
        banco:
          type: object
          description: Identificação do banco do extrato
          properties:
            org:
              type: string
              description: Organização (ORG do OFX)
              example: SICOOB
            fid:
              type: string
              description: ID do banco (FID do OFX)
              example: '756'
        conta:
          type: object
          description: Dados da conta bancária
          properties:
            agencia:
              type: string
              description: Agência (bank_id do OFX)
              example: '756'
            numero:
              type: string
              description: Número da conta
              example: '12345-6'
            tipo:
              type: string
              description: Tipo da conta (CHECKING, SAVINGS, etc)
              example: CHECKING
        periodo:
          type: object
          description: Período coberto pelo extrato
          properties:
            inicio:
              type: string
              format: date
              example: '2025-01-01'
            fim:
              type: string
              format: date
              example: '2025-01-31'
        saldo:
          type: object
          properties:
            valor:
              type: number
              format: float
              example: 15420.50
            data:
              type: string
              format: date
              example: '2025-01-31'
        transacoes:
          type: array
          items:
            $ref: '#/components/schemas/OfxTransacao'
        resumo:
          type: object
          properties:
            total_transacoes:
              type: integer
              example: 45
            total_creditos:
              type: integer
              example: 28
            total_debitos:
              type: integer
              example: 17
            soma_creditos:
              type: number
              format: float
              example: 85000.00
            soma_debitos:
              type: number
              format: float
              example: 69579.50

    OfxTransacao:
      type: object
      properties:
        fitid:
          type: string
          description: ID único da transação no OFX
          example: '202501150001'
        tipo:
          type: string
          enum: [CREDIT, DEBIT]
          description: Crédito ou débito
          example: CREDIT
        data:
          type: string
          format: date
          example: '2025-01-15'
        valor:
          type: number
          format: float
          description: Valor absoluto (sempre positivo)
          example: 1250.00
        memo:
          type: string
          description: Descrição da transação
          example: COBRANCA SICOOB 0000012345
        name:
          type: string
          description: Nome do beneficiário/pagador
        checknum:
          type: string
          description: Número do cheque (quando aplicável)
        refnum:
          type: string
          description: Número de referência
        nosso_numero_extraido:
          type: string
          nullable: true
          description: Nosso número extraído do memo via regex específica do banco
          example: '0000012345'

    OfxError:
      type: object
      required:
        - erro
      properties:
        erro:
          type: string
          description: Mensagem de erro
          examples:
            - Arquivo OFX inválido ou não reconhecido
            - Nenhum arquivo enviado
            - Nenhuma conta encontrada no arquivo

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensagem de erro
          example: Dados inválidos
        validation_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        details:
          type: string
          description: Detalhes do erro
        type:
          type: string
          description: Tipo do erro (ex ArgumentError, ValidationError)
