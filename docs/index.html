<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boleto CNAB API — Interactive documentation</title>
    <meta
      name="description"
      content="REST micro-service for Brazilian boletos and CNAB 240/400 remessa/retorno files, powered by BRCobranca."
    />
  </head>
  <body>
    <!--
      Interactive API reference rendered by Scalar (https://scalar.com)
      from the openapi.json generated by scripts/generate_openapi.rb.

      Served in two places:
      - GitHub Pages: https://akretion.github.io/boleto_cnab_api/
      - inside the running container at http://localhost:9292/docs
        (same origin as the API, so Scalar's "Try it" works there)
    -->
    <script
      id="api-reference"
      data-url="./openapi.json"
      data-configuration='{"servers":[{"url":"http://localhost:9292","description":"Local container (docker run -p 9292:9292 ghcr.io/akretion/boleto_cnab_api)"}]}'
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
