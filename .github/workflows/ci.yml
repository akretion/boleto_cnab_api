name: Build

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 4 * * 0"

jobs:
  build-boleto-cnab-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # vendor/brcobranca é gerado (gitignored): agrega o upstream kivanio com
      # o fork akretion antes do build. Ver docs/AGREGACAO_BRCOBRANCA.md.
      - name: Install git-aggregator
        run: pip install git-aggregator
      - name: Aggregate BRCobranca (kivanio master + akretion IMP-split_payment_ibs_cbs)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gitaggregate -c gitaggregate.yaml --no-color
          git -C vendor/brcobranca log --oneline -3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          cache-from: type=registry,ref=ghcr.io/build-boleto-cnab-api-latest
          cache-to: type=local,dest=/tmp/.buildx-cache
          load: true
      - name: Install test pre-requisites
        run: pip install pytest
      - name: Test
        run: pytest -v
      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: |
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=inline
          push: true
        if: ${{ github.repository_owner == 'akretion' && github.ref == 'refs/heads/master' }}
